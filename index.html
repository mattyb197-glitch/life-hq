(()=>{'use strict';const KEY='lifehq.v1';const areas=[{id:'family',name:'Family Life',color:'#e1bd78',icon:'⌂'},{id:'lifewise',name:'LifeWise Academy',color:'#78bce1',icon:'▣'},{id:'productions',name:'Matt Burleson Productions',color:'#ac9ada',icon:'◉'},{id:'church',name:'Reclamation Church',color:'#da8181',icon:'✝'},{id:'frame',name:'Frame + Motion Collective',color:'#8ad1b5',icon:'▧'},{id:'podcast',name:'Shed Some Light Podcast',color:'#e6a575',icon:'♫'}];const verses=[['Be still, and know that I am God.','Psalm 46:10'],['Cast thy burden upon the LORD, and he shall sustain thee.','Psalm 55:22'],['Come unto me, all ye that labour and are heavy laden, and I will give you rest.','Matthew 11:28'],['Trust in the LORD with all thine heart; and lean not unto thine own understanding.','Proverbs 3:5'],['This is the day which the LORD hath made; we will rejoice and be glad in it.','Psalm 118:24'],['My grace is sufficient for thee: for my strength is made perfect in weakness.','2 Corinthians 12:9'],['The LORD is my shepherd; I shall not want.','Psalm 23:1']];const dateKey=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};const today=()=>dateKey(new Date());const plusDays=(d,n)=>{let a=new Date(d+'T12:00:00');a.setDate(a.getDate()+n);return dateKey(a)};const emptyState=()=>({tasks:[],events:[],inbox:[],focus:['','',''],notes:'',settings:{name:'Matt'}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||emptyState()}catch{state=emptyState()}if(!Array.isArray(state.tasks)||!Array.isArray(state.events)||!Array.isArray(state.inbox))state=emptyState();if(!Array.isArray(state.focus))state.focus=['','',''];let page='home',areaFilter=null,calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),taskFilter='open';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Math.random() /button>';nav();$('#content').innerHTML=({home:homeView,today:todayView,tasks:tasksView,calendar:calendarView,inbox:inboxView,area:areaView,settings:settingsView}[page]||homeView)();}function greeting(){let h=new Date().getHours();return `Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${state.settings?.name||'Matt'}.`;}function taskRow(t){return `<div class="task ${t.done?'done':''}"><input aria-label="Complete task" type="checkbox" data-complete="${t.id}" ${t.done?'checked':''}><div class="task-main"><span class="task-title">${esc(t.title)}</span><div class="meta"><span>${areaChip(t.area)}</span>${t.due?`<span style="color:${due(t)?'#ee9d99':''}">${due(t)?'Overdue · ':''}${labelDate(t.due)}</span>`:''}${t.status==='waiting'?'<span>↪ Waiting on someone</span>':''}</div></div><span class="chip ${t.priority==='high'?'priority-high':t.priority==='low'?'priority-low':''}">${esc(t.priority||'medium')}</span><div class="task-actions"><button class="icon-btn" data-edit-task="${t.id}" aria-label="Edit task">✎</button><button class="icon-btn" data-delete-task="${t.id}" aria-label="Delete task">×</button></div></div>`}function taskList(ts){return ts.length?`<div class="tasks">${ts.sort(order).map(taskRow).join('')}</div>`:'<div class="empty">Nothing here. Take the breathing room.</div>'}function agenda(){const ev=state.events.filter(e=>e.date>=today()).map(e=>({...e,type:'event'}));const tasks=open().filter(t=>t.due&&t.due>=today()).map(t=>({...t,date:t.due,type:'task'}));let entries=[...ev,...tasks].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);return entries.length?entries.map(e=>`<div class="agenda-item"><span class="agenda-date">${labelDate(e.date)}</span><div><div class="agenda-title">${esc(e.title)}</div><div class="small muted">${areaChip(e.area)} · ${e.type==='event'?(e.time||'All day'):'Task due'}</div></div></div>`).join(''):'<div class="empty">No upcoming items yet. Add an event or a task with a due date.</div>'}function verse(){const index=Math.floor(Da ondary" data-go="calendar">Calendar →</button></div>${agenda()}</section></div></div>`}function focusEditor(){return `<div class="checkin">${[0,1,2].map(i=>`<div class="focus-row"><span class="chip">${i+1}</span><input class="field" data-focus="${i}" placeholder="${['Your one must-do','Your next most important','One thing that brings peace'][i]}" value="${esc(state.focus[i]||'')}"></div>`).join('')}</div><div class="help">Pick only three. The rest can wait its turn.</div>`}function todayView(){let dueToday=open().filter(t=>t.due===today());let overdue=open().filter(due);return `<div class="stack">${verse()}<div class="panel"><div class="section-head"><h2>Today's Focus</h2></div>${focusEditor()}</div><div class="two-col"><div class="panel"><div class="section-head"><h2>Due Today (${dueToday.length})</h2></div>${taskList(dueToday)}</div><div class="panel"><div class="section-head"><h2>Needs Attention (${overdue.length})</h2></div>${taskList(overdue)}</div></div><div class="panel"><div class="section-head"><h2>Personal Notes</h2></div><textarea rows="5" id="dailyNotes" placeholder="What would make today feel successful?">${esc(state.notes||'')}</textarea><div class="help">Saved automatically when you finish editing.</div></div></div>`}function tasksView(){let ts=state.tasks.filter(t=>!areaFilter||t.area===areaFilter);if(taskFilter==='open')ts=ts.filter(t=>!t.done);if(taskFilter==='completed')ts=ts.filter(t=>t.done);if(taskFilter==='waiting')ts=ts.filter(t=>t.status==='waiting'&&!t.done);return `<div class="panel"><div class="toolbar"><select class="field" id="filterArea"><option value="">All life areas</option>${areas.map(a=>`<option value="${a.id}" ${areaFilter===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select><select class="field" id="filterStatus">${['open','all','waiting','completed'].map(s=>`<option ${taskFilter===s?'selected':''} value="${s}">${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}</select><span class="small muted">${ts.length} tasks</span></div>${taskList(ts)}</div>`}function areaView(){let ts=state.tasks.filter(t=>t.area===areaFilter);let ev=state.events.filter(e=>e.area===areaFilter&&e.date>=today()).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="stack"><div class="metrics"><div class="panel metric"><strong>${ts.filter(t=>!t.done).length}</strong><span>Open</span></div><div class="panel metric"><strong>${ts.filter(t=>t.done).length}</strong><span>Completed</span></div><div class="panel metric"><strong>${ts.filter(t=>t.status==='waiting'&&!t.done).length}</strong><span>Waiting</span></div><div class="panel metric"><strong>${ev.length}</strong><span>Upcoming Events</span></div></div><div class="panel"><div class="section-head"><h2>Active Tasks</h2><button class="btn tiny" data-add-area="${areaFilter}">+ Add Task</button></div>${taskList(ts.filter(t=>!t.done))}</div><div class="panel"><div class="section-head"><h2>Upcoming Events</h2></div>${ev.length?ev.map(e=>`<div class="agenda-item"><span class="agenda-date">${labelDate(e.date)}</span><div class="agenda-title">${esc(e.title)} ${e.time?`<span class="muted small">· ${e.time}</span>`:''}</div><button class="icon-btn" data-edit-event="${e.id}">✎</button></div>`).join(''):'<div class="empty">No upcoming events in this area.</div>'}</div><div class="panel"><div class="section-head"><h2>Completed</h2></div>${taskList(ts.filter(t=>t.done))}</div></div>`}function captureForm(){return `<form id="captureForm" class="form-row"><input class="quick-input" id="captureText" required placeholder="What's on your mind?" aria-label="Quick capture"><button class="btn" type="button" data-capture>Capture</button></form><div class="help">Don't sort it yet. Just get it out of your head.</div>`}function inboxMini(){return state.inbox.length?`<div class="capture-list">${state.inbox.slice(0,3).map(x=>`<div class="capture-item"><span>• ${esc(x.text)}</span><button title="Turn into task" class="icon-btn" data-promote="${x.id}">↗</button></div>`).join('')}</div>`:''}function inboxView(){return `<div class="stack"><div class="panel"><div class="section-head"><h2>Free Your Mind</h2><span class="chip">${state.inbox.length} captured</span></div>${captureForm()}</div><div class="panel"><div class="section-head"><h2>Unsorted Thoughts</h2></div>${state.inbox.length?`<div class="capture-list">${state.inbox.map(x=>`<div class="capture-item"><span>${esc(x.text)}</span><button class="btn tiny secondary" data-promote="${x.id}">Make Task</button><button class="icon-btn" aria-label="Remove item" data-delete-inbox="${x.id}">×</button></div>`).join('')}</div>`:'<div class="empty">Your inbox is clear. Capture anything you want to remember.</div>'}</div></div>`}function calendarView(){let year=calMonth.getFullYear(),month=calMonth.getMonth(),first=new Date(year,month,1),offset=first.getDay(),days=new Date(year,month+1,0).getDate();let cells=[];for(let i=0;i<42;i++){let d=new Date(year,month,i-offset+1),k=dateKey(d),items=state.events.filter(e=>e.date===k).map(e=>({title:e.title,area:e.area,type:'event'})),taskitems=open().filter(t=>t.due===k).map(t=>({title:t.title,area:t.area,type:'task'}));items.push(...taskitems);cells.push(`<button class="day ${d.getMonth()!==month?'other':''} ${k===today()?'today':''}" data-date="${k}"><span class="day-num">${d.getDate()}</span>${items.slice(0,3).map(e=>`<div class="event-pill ${e.type==='task'?'task-pill':''}" style="border-left-color:${ar(e.area).color}" title="${esc(e.title)}">${e.type==='task'?'☑ ':''}${esc(e.title)}</div>`).join('')}${items.length>3?`<div class="small muted">+${items.length-3} more</div>`:''}</button>`)}return `<div class="panel"><div class="calendar-top"><div><button class="btn secondary tiny" data-cal="prev">←</button> <button class="btn secondary tiny" data-cal="today">Today</button> <button class="btn secondary tiny" data-cal="next">→</button></div><h2>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2></div><div class="calendar-grid">${['Sun','M div class="form-field"><label>Notes</label><textarea name="notes" class="field" rows="2">${esc(e.notes||'')}</textarea></div><div class="form-footer">${e.id?'<button type="button" class="btn ghost" id="deleteEvent">Delete</button>':''}<button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save Event</button></div></form>`)}function dateModal(date){let ev=state.events.filter(e=>e.date===date),ts=state.tasks.filter(t=>t.due===date);modal(`<h2>${new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>${ev.length||ts.length?`<div class="capture-list">${ev.map(e=>`<div class="capture-item"><span>${esc(e.title)}</span><button class="icon-btn" data-edit-event="${e.id}">✎</button></div>`).join('')}${ts.map(t=>`<div class="capture-item"><span>☑ ${esc(t.title)}</span><button class="icon-btn" data-edit-task="${t.id}">✎</button></div>`).join('')}</div>`:'<p class="muted">Nothing scheduled.</p>'}<div class="form-footer"><button class="btn ghost" data-close>Close</button><button class="btn secondary" data-new-task-date="${date}">+ Task</button><button class="btn" data-new-event-date="${date}">+ Event</button></div>`)}function captureThought(){const input=$('#captureText');if(!input)return;const txt=input.value.trim();if(!txt){input.focus();return}state.inbox.unshift({id:id(),text:txt,created:today()});save();render();const confirmation=document.createElement('div');confirmation.className='notice';confirmation.setAttribute('role','status');confirmation.textContent='✓ Captured in Brain Dump';$('#content').prepend(confirmation);setTimeout(()=>confirmation.remove(),2500)}document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.capture!==undefined){ev.preventDefault();captureThought();return}if(b.id==='menuBtn'){$('#sidebar').classList.toggle('show');return}if(b.dataset.page){go(b.dataset.page,b.dataset.area||null);return}if(b.dataset.go){go(b.dataset.go,b.dataset.area||null);return}if(b.id==='addTask'){taskModal();return}if(b.id==='addEvent'){eventModal();return}if(b.dataset.addArea){taskModal({area:b.dataset.addArea});return}if(b.dataset.editTask){taskModal(state.tasks.find(t=>t.id===b.dataset.editTask));return}if(b.dataset.deleteTask){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.deleteTask);save();render()}return}if(b.dataset.editEvent){eventModal(state.events.find(e=>e.id===b.dataset.editEvent));return}if(b.dataset.deleteInbox){state.inbox=state.inbox.filter(x=>x.id!==b.dataset.deleteInbox);save();render();return}if(b.dataset.promote){let x=state.inbox.find(x=>x.id===b.dataset.promote);taskModal({title:x.text},x.id);return}if(b.dataset.cal){calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(b.dataset.cal==='next'?1:b.dataset.cal==='prev'?-1:0),1);if(b.dataset.cal==='today')calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);render();return}if(b.dataset.date){dateModal(b.dataset.date);return}if(b.dataset.newTaskDate){taskModal({due:b.dataset.newTaskDate});return}if(b.dataset.newEventDate){eventModal({date:b.dataset.newEventDate});return}if(b.dataset.close!==undefined){closeModal();return}if(b.id==='deleteEvent'){let eid=$('#eventForm [name=id]').value;if(confirm('Delete event?')){state.events=state.events.filter(x=>x.id!==eid);save();closeModal();render()}return}if(b.id==='saveName'){state.settings={name:$('#nameSetting').value.trim()||'Matt'};save();render();return}if(b.id==='exportData'){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='life-hq-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.id==='importData'){$('#importFile').click();return}});document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.complete){let t=state.tasks.find(t=>t.id===el.dataset.complete);if(t){t.done=el.checked;save();render()}return}if(el.dataset.focus!==undefined){state.focus[Number(el.dataset.focus)]=el.value;save();return}if(el.id==='filterArea'){areaFilter=el.value||null;render();return}if(el.id==='filterStatus'){taskFilter=el.value;render();return}if(el.id==='dailyNotes'){state.notes=el.value;save();return}});document.addEventListener('submit',ev=>{if(!['captureForm','taskForm','eventForm'].includes(ev.target.getAttribute('id')))return;ev.preventDefault();let f=ev.target,fd=new FormData(f),x=Object.fromEntries(fd);if(f.getAttribute('id')==='captureForm'){captureThought();return}if(f.getAttribute('id')==='taskForm'){if(!x.title.trim())return;let task={id:x.id||id(),title:x.title.trim(),area:x.area,priority:x.priority,due:x.due,status:x.status,notes:x.notes,done:state.tasks.find(t=>t.id===x.id)?.done||false};if(x.id)state.tasks=state.tasks.map(t=>t.id===x.id?task:t);else state.tasks.push(task);if(x.promote)state.inbox=state.inbox.filter(i=>i.id!==x.promote)}else if(f.getAttribute('id')==='eventForm'){if(!x.title.trim()||!x.date)return;let event={id:x.id||id(),title:x.title.trim(),date:x.date,time:x.time,area:x.area,notes:x.notes};if(x.id)state.events=state.events.map(e=>e.id===x.id?event:e);else state.events.push(event)}save();closeModal();render()});document.addEventListener('input',ev=>{if(ev.target.dataset.focus!==undefined){state.focus[Number(ev.target.dataset.focus)]=ev.target.value;save()}if(ev.target.id==='dailyNotes'){state.notes=ev.target.value;save()}});$('#modalRoot').addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal()});$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.events)||!Array.isArray(data.inbox)||!Array.isArray(data.focus))throw Error('Invalid backup format');if(!confirm('Replace all current dashboard data with this backup?'))return;state={...emptyState(),...data};save();render();alert('Backup restored successfully.')}catch(err){alert('Could not import backup: '+err.message)}e.target.value=''});render();})();
</script></body></html>
